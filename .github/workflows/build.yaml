# The name of our workflow
name: Build
on:
  push:
  pull_request:

jobs:
  bisect:
    strategy:
      fail-fast: false
      matrix:
        pad_size: [0, 8, 16, 24, 32, 40, 48, 56, 64]

    runs-on: macos-26
    name: "bisect pad=${{matrix.pad_size}} - macos-26 - libressl - asan"
    env:
      CFLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=all -fno-optimize-sibling-calls -fsanitize-address-use-after-scope -fno-omit-frame-pointer -g -O1 -DSNI_REPRO_PAD_BYTES=${{matrix.pad_size}}"
      LDFLAGS: "-fsanitize=address,undefined -fno-sanitize-recover=all"
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - name: Install dependencies
        run: brew install libressl lzo lz4 man2html cmocka libtool automake autoconf
      - name: Checkout OpenVPN
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Set environment
        run: |
          cat >>$GITHUB_ENV <<EOF;
          OPENSSL_CFLAGS=-I$(brew --prefix libressl)/include
          OPENSSL_LIBS=-L$(brew --prefix libressl)/lib -lcrypto -lssl
          LZO_CFLAGS=-I$(brew --prefix lzo)/include
          LZO_LIBS=-L$(brew --prefix lzo)/lib -llzo2
          EOF
      - name: autoconf
        run: autoreconf -fvi
      - name: configure
        run: ./configure --enable-werror --disable-plugin-auth-pam --disable-plugin-down-root
      - name: make all
        run: make -j4
      - name: configure checks
        run: echo 'RUN_SUDO="sudo -E"' >tests/t_server_null.rc
      - name: make check
        run: make -j4 check VERBOSE=1
      # See doc/known-issue-libressl-asan-macos-ci.md -- bisecting the minimal
      # SNI_REPRO_PAD_BYTES that reproduces the struct-layout-triggered crash.
      # always() (not failure()): need the SIZECHECK line even on passing runs.
      - name: Show t_server_null server/client logs (always)
        if: always()
        run: |
          shopt -s nullglob
          for d in tests/t_server_null-*/; do
            for f in "$d"*.log; do
              echo "===== $f ====="
              cat "$f"
              echo
            done
          done
